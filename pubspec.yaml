name: preparatorio_concursos
description: Aplicativo multiplataforma para preparação de concursos públicos.
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.1.1
  http: ^1.3.0
  shared_preferences: ^2.0.6
  in_app_purchase: ^3.2.1
  file_picker: ^10.1.2
  path_provider: ^2.1.5
  syncfusion_flutter_pdf: ^24.1.42
  flutter_pdfview: ^1.4.0
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_commons: ^0.11.0
  image: ^4.1.3
  collection: ^1.18.0
  table_calendar: ^3.1.3
  intl: ^0.19.0
  fl_chart: ^0.70.0

  flutter_dotenv: ^5.2.1
  yaml: ^3.1.2
  crypto: ^3.0.3
  url_launcher: ^6.2.4
  just_audio: ^0.9.34
  just_audio_windows: ^0.2.0

  # Calendário e compartilhamento
  add_2_calendar: ^2.2.4
  device_calendar: ^4.3.2
  timezone: ^0.9.4
  share_plus: ^7.2.1

  # Feedback
  feedback: ^3.0.0

  # Injeção de dependência
  get_it: ^8.0.0
  injectable: ^2.3.2

  # Firebase
  firebase_core: ^2.25.4
  firebase_analytics: ^10.8.5
  firebase_crashlytics: ^3.4.14
  firebase_performance: ^0.9.3+13
  firebase_remote_config: ^4.3.13

  # Armazenamento seguro
  flutter_secure_storage: ^9.0.0

  # Google APIs
  googleapis: ^14.0.0
  googleapis_auth: ^2.0.0
  google_generative_ai: ^0.2.0
  flutter_appauth: ^6.0.2

  # MCP (Model Context Protocol)
  mcp_client: ^0.1.7
  mcp_server: ^0.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3
  injectable_generator: ^2.4.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/gemini_api_steps/
    - assets/data/
    - assets/data/client.json
    - assets/fonts/
    - assets/i18n/
    - assets/audio_explanations/
    - lib/core/prompts/
    - lib/core/prompts/edital_analysis/
    - .env